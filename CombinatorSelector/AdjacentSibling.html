<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjacent Sibling</title>
    <style>
        p+h1{
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>
    <p>King</p>
    <h1>Stark</h1>
    <h1>Thor</h1>
</body>
</html>
