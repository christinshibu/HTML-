<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendent Selector</title>
    <style>
        div h1 {
            text-align: center;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        article p{
            text-align: center;
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <div>
        <h1>Direct Child 1</h1>
        <h1>Direct Child 2</h1>
        <h1>Direct Child 3</h1>
        <section>
            <h1>Indirect Child</h1>
        </section>
    </div>
    <br><br><br><br><br>
    <hr>
    <article>
        <p>Hi</p>
        <h1>Hello</h1>
        <p>Bye</p>
        <div>
            <p>⭐</p>
        </div>
    </article>
</body>

</html>
