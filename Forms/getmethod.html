<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <h1>Get Method</h1>

    <form method="get">

        <label for="">Username:</label>
        <input name="USERNAME" type="text">
        <br><br>

        <label for="">Gender:</label>
        <input type="radio" name="GENDER" value="male">Male
        <input type="radio" name="GENDER" value="female">Female
        <input type="radio" name="GENDER" value="other">Others

        <br><br>

        <label for="">Hobbies</label>
        <input type="checkbox" name="CHECKBOX" id="" value="Sleeping">Sleeping
        <input type="checkbox" name="CHECKBOX" id="" value="Travelling">Travelling
        <input type="checkbox" name="CHECKBOX" id="" value="Thinking">Thinking

        <br><br>

        <button>Submit</button>

    </form>
</body>

</html>
