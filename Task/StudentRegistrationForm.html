<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .form-box {
            width: 450px;
            margin: 30px auto;
            background-color: white;
            border: 1px solid lightgray;
            border-radius: 8px;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid gray;
            border-radius: 4px;
        }

        .gender input,
        .skills input {
            width: auto;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .submit {
            background-color: blue;
        }

        .reset {
            background-color: gray;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h3>1. Student Registration Form</h3>

        <form>

            <label>Full Name:</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password:</label>
            <input type="password" placeholder="Enter password" minlength="5" required>

            <label>Age:</label>
            <input type="number" min="1" max="100">

            <label>Gender:</label>

            <div class="gender">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> Other
            </div>

            <br>

            <label>Date of Birth:</label>
            <input type="date">

            <label>Phone:</label>
            <input type="tel" placeholder="Enter 10-digit number" pattern="[0-9]{10}">

            <label>City:</label>

            <select>
                <option>Select City</option>
                <option>Kochi</option>
                <option>Calicut</option>
                <option>Trivandrum</option>
            </select>

            <label>Skills:</label>

            <div class="skills">
                <input type="checkbox"> HTML
                <input type="checkbox"> CSS
                <input type="checkbox"> JavaScript
            </div>

            <br>

            <label>Photo:</label>
            <input type="file">

            <label>Address:</label>

            <textarea rows="4" placeholder="Enter your address"></textarea>

            <button type="submit" class="submit">Submit</button>

            <button type="reset" class="reset">Reset</button>

        </form>

    </div>

</body>

</html>
