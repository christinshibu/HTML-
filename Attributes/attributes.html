<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ---------------------------ID-------------------------- */
        #C{
            color: red;
        }

        /* ------------------------------Class------------------------- */
        .C{
            background-color: bisque;
        }
    </style>
</head>
<body>
<!-- --------------------ID--------------------------- -->
    <h1>ID Only</h1>
    <p id="C">Christin</p>
    <p>Alan</p>
    <p>Anandhu</p>
    <p id="C">Vishnu</p>

<!-- -------------------------Class--------------------------- -->
<br><br><br><br>
<h1>Class Only</h1>
<h2 class="C">Christin</h1>
<p>Sam</p>
<h3 class="C">Vishnu</h3>
<i class="C">Alan</i> 
<h6 class="C">Anandhu</h6>

</body>
</html>
