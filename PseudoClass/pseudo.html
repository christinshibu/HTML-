<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link{
            color: goldenrod;
        }
        a:visited{
            color: bisque;
        }
        a:active{
            color: black;
        }

        li:first-child{
            color: green;
            background-color: lightgreen
        }
        li:last-child{
            color: red;
            background-color:lightblue
        }
        li:nth-child(3){
            color: brown;
            background-color:beige
        }
    </style>
</head>
<body>
    <a href="https://amazon.com">welcome to flipkart</a>

    <br><br><br><br><br><br><hr>
    <ul>
        <li>Chennai</li>
        <li>Hyderabad</li>
        <li>Banglore</li>
        <li>Kochi</li>
    </ul>
</body>
</html>
