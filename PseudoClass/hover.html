<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover</title>
    <style>
        button{
            background-color: tomato;
            padding: 15px;
            border: none;
        }
        button:hover{
            background-color: brown;
            padding:20px
        }
    </style>
</head>
<body>
    <h1>Pseudo Class Example</h1>

    <button>Watch Trailer</button>
</body>
</html>
