<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            border-collapse: collapse;
        }

        thead {
            background-color: rgb(217, 255, 161);
        }

        tbody {
            background-color: rgb(255, 167, 255);
        }

        tfoot {
            background-color: rgb(251, 132, 132);
        }
    </style>
</head>

<body>
    <table border="1" cellpadding="20px">
        <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Laptop</td>
                <td>2</td>
                <td>120000</td>
            </tr>

            <tr>
                <td>Mouse</td>
                <td>1</td>
                <td>500</td>
            </tr>
            <tr>
                <td>Keyboard</td>
                <td>3</td>
                <td>1500</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Grand Total</th>
                <td>6</td>
                <td>122000</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
