<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <table border="2" cellspacing="10px">

        <tr>
            <th>Department</th>
            <th colspan="2">Employees</th>
            
        </tr>

        <tr>
            <td rowspan="4">IT Department</td>
            <td><b>ID</b></td>
            <td><b>Name</b></td>
            <td><b>Role</b></td>
        </tr>

        <tr>
            
            <td>1</td>
            <td>David</td>
            <td>Developer</td>
        </tr>
        
        <tr>
            
            <td>2</td>
            <td>Emma</td>
            <td>Tester</td>
        </tr>

        <tr>
            
            <td>3</td>
            <td>Chris</td>
            <td>Analyst</td>
        </tr>

        <tr>
            <td>Total Employees</td>
            <td colspan="3">3</td>
            
        </tr>

    </table>
</body>
</html>
